[project]
name = "sunwai-api"
version = "1.0.0"
description = "Sunwai backend: consumer complaint escalation ladder with TinyFish web agents"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "jsonschema>=4.22",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

